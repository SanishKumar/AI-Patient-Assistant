name: Checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t aether-check .
      - name: Validate reverse proxy configuration
        run: docker run --rm -e AETHER_DOMAIN=aether.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start configured container
        run: |
          docker run -d --name aether-check -p 127.0.0.1:3100:3000 \
            -e BETTER_AUTH_URL=https://aether.example.test \
            -e BETTER_AUTH_SECRET=container-test-secret-with-at-least-32-characters \
            -e AETHER_DATA_KEY=$(openssl rand -base64 32) \
            -e AETHER_DATABASE_PATH=/data/aether.sqlite \
            -e AETHER_PUBLIC_ACCOUNTS=1 \
            -e SMTP_HOST=mail.example.test -e SMTP_PORT=587 \
            -e SMTP_USER=test -e SMTP_PASSWORD=test -e SMTP_FROM=test@example.test \
            aether-check
      - name: Check health and private route protection
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3100/api/health
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/workspace)" = 401
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3100/api/workspace/documents)" = 401
      - name: Check document parser in the runtime image
        run: |
          docker exec aether-check node --input-type=module -e '
            import { PDFDocument } from "pdf-lib";
            import { spawnSync } from "node:child_process";
            import sharp from "sharp";
            const pdf = await PDFDocument.create();
            pdf.addPage();
            const image = await sharp({ create: { width: 20, height: 20, channels: 3, background: "white" } }).png().toBuffer();
            for (const [type, bytes] of [["application/pdf", await pdf.save()], ["image/png", image]]) {
              const result = spawnSync(process.execPath, ["scripts/inspect-document.mjs", type], { input: bytes });
              if (result.status !== 0 || JSON.parse(result.stdout).pages !== 1) process.exit(1);
            }
          '
      - name: Container diagnostics
        if: failure()
        run: docker logs aether-check
